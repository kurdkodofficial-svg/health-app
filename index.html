<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستەمی بەڕێوەبردنی تەندروستی</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c62828">
<style>
  :root { --bg: #faf3f2; --card: #ffffff; --text: #2c2c2c; --primary: #c62828; --border: #e0e0e0; }
  [data-theme="dark"] { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --primary: #ef5350; --border: #333333; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; direction: rtl; }
  .container { max-width: 800px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
  .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-top: 15px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; display: none; }
  .toast.show { display: block; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-content { background: var(--card); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
  form { display: grid; gap: 10px; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--text); }
  .appt { border-bottom: 1px solid var(--border); padding: 10px 0; display: flex; justify-content: space-between; }
  .del { background: none; border: none; cursor: pointer; }
</style>
</head>
<body>
